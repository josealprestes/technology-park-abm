[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technology-park-abm"
version = "1.0.0"
description = "Agent-based model of technology parks and innovation ecosystems"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "mesa>=3.5,<4",
    "networkx>=3,<4",
]

[project.optional-dependencies]
dev = [
    "axe-playwright-python>=0.1,<1",
    "hypothesis>=6,<7",
    "mutmut>=3,<4",
    "playwright>=1.40,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    # Cross-validation of the Morris/Sobol estimators against SALib
    # (tests/test_gsa_crosscheck.py); dev-only, never a runtime dependency.
    "SALib>=1.5,<2",
    # Toolchain 2026 (ADR 0013): additional static type checkers (ty, pyrefly)
    # alongside mypy, and cosmic-ray as the config-driven mutation runner.
    # Dev-only; never runtime dependencies.
    "ty>=0.0.1a1",
    "pyrefly>=0.40",
    "cosmic-ray>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
]
markers = [
    "unit: fast isolated component tests (default)",
    "regression: golden trajectory and drift guards",
    "smoke: quick end-to-end sanity runs via subprocess or CLI",
    "e2e: full-system flows (long runs, HTTP, experiment files)",
    "gate: deterministic skill-derived quality gates (static scans, contracts, small runs)",
    "a11y: automated browser accessibility checks (needs `playwright install chromium`)",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
follow_untyped_imports = true

[tool.coverage.run]
source = ["technology_park_abm"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
source_paths = [
    "src/technology_park_abm/network.py",
    "src/technology_park_abm/metrics.py",
    "src/technology_park_abm/validation.py",
]
# The mutants tree must be a complete, importable package: copy the whole
# src/ so sibling modules resolve when tests import technology_park_abm.*.
also_copy = ["src"]
# In-process tests that exercise the scoped modules, directly or through
# the model. Browser/server/gate/data tests are deliberately excluded: the
# stats run must pass cleanly inside the mutants tree, and mutmut's parallel
# workers would make port-bound tests falsely kill mutants (ADR 0013).
pytest_add_cli_args_test_selection = [
    "tests/test_agents.py",
    "tests/test_boundaries.py",
    "tests/test_config.py",
    "tests/test_contracts.py",
    "tests/test_environment.py",
    "tests/test_enrichment.py",
    "tests/test_fuzz.py",
    "tests/test_manifest.py",
    "tests/test_metamorphic.py",
    "tests/test_metrics.py",
    "tests/test_model.py",
    "tests/test_network.py",
    "tests/test_policy.py",
    "tests/test_processes.py",
    "tests/test_properties.py",
    "tests/test_regression.py",
    "tests/test_snapshot.py",
    "tests/test_statistics.py",
    "tests/test_validation.py",
]

[[tool.mypy.overrides]]
module = ["technology_park_abm.agents", "technology_park_abm.model"]
disallow_untyped_calls = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
technology_park_abm = ["static/*.html"]
